[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "optiland_small"
version = "0.1.0"
description = "Experiment: can Rust speed up Optiland's small, overhead-bound operations?"
requires-python = ">=3.11"
dependencies = ["numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
